# Netlify Configuration for Jinal Collection
# www.jinalcollection.in

[build]
  publish = "."

# ── Custom 404 page ───────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── non-WWW → WWW redirect ────────────────────
[[redirects]]
  from   = "https://jinalcollection.in/*"
  to     = "https://www.jinalcollection.in/:splat"
  status = 301
  force  = true

# ── HTTP → HTTPS redirect ─────────────────────
[[redirects]]
  from   = "http://jinalcollection.in/*"
  to     = "https://www.jinalcollection.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.jinalcollection.in/*"
  to     = "https://www.jinalcollection.in/:splat"
  status = 301
  force  = true

# ── Security & Performance Headers ───────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-XSS-Protection          = "1; mode=block"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ── Cache static assets aggressively ─────────
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── HTML: no cache (always fresh) ────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
